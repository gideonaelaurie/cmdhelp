name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # 1. Install the official Snapcraft builder tool on the server
    - name: Install Snapcraft
      run: |
        sudo snap install snapcraft --classic

    # 2. Tell Snapcraft to build using Canonical's cloud builders (bypasses local container restrictions)
    - name: Build Remote Snap
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      run: |
        snapcraft remote-build

    # 3. Publish the downloaded file directly to the stable storefront channel
    - name: Upload to Store
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      run: |
        snapcraft upload --release=stable *.snap
