name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get clean
        sudo apt-get update --fix-missing
        sudo apt-get install -y --fix-missing python3-tk squashfs-tools

    - name: Prepare Package Blueprint Layout
      run: |
        # Creates a standard layout mapping compliant with Store policies
        mkdir -p prime/meta
        mkdir -p prime/bin
        
        # Copy the script directly into the executable binary directory
        cp cmdhelp.py prime/bin/cmdhelp.py
        chmod +x prime/bin/cmdhelp.py

    - name: Compile Runtime Metadata Sheet
      run: |
        cat << 'EOF' > prime/meta/snap.yaml
        name: cmdhelp
        version: '1.1.3'              # Version bump to bypass store collision caches
        summary: Desktop helper tool with Tkinter GUI
        description: |
          A helpful desktop utility tool built with Python and Tkinter.
        confinement: strict
        grade: stable
        base: core24
        architectures:
          - amd64
        apps:
          cmdhelp:
            # Point natively into the relative binary folder inside the mount slot
            command: bin/cmdhelp.py
            command-chain: [_not_specified_]
            plugs:
              - desktop
              - desktop-legacy
              - x11
              - wayland
        EOF

    - name: Pack Production Snap
      run: |
        mksquashfs prime cmdhelp_1.1.3_amd64.snap -noappend -comp xz

    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      with:
        snap: cmdhelp_1.1.3_amd64.snap
        release: stable
