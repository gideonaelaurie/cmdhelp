name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # 1. Build an official, validated SquashFS binary image using the cloud compiler
    - uses: snapcore/action-build@v1
      id: snapcraft

    # 2. Upload the official compilation file directly to your storefront slot
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      with:
        snap: ${{ steps.snapcraft.outputs.snap }}
        release: stable
