name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # 1. Structure the required Snap filesystem directories
    - name: Prepare Package Blueprint Layout
      run: |
        mkdir -p prime/meta
        mkdir -p prime/bin
        cp cmdhelp.py prime/bin/cmdhelp.py

    # 2. Write the compiled runtime metadata into a production snap.yaml sheet
    - name: Compile Runtime Metadata Sheet
      run: |
        cat << 'EOF' > prime/meta/snap.yaml
        name: cmdhelp
        version: '1.1.0'
        summary: Desktop helper tool with Tkinter GUI
        description: |
          A helpful desktop utility tool built with Python and Tkinter.
        confinement: strict
        grade: stable
        base: core24
        architectures:
          - amd64
        apps:
          cmdhelp:
            command: bin/python3 $SNAP/bin/cmdhelp.py
            plugs:
              - desktop
              - desktop-legacy
              - x11
              - wayland
        EOF

    # 3. Use the native user-space compressor tool to generate the snap package
    - name: Pack Production Snap
      run: |
        sudo apt-get update && sudo apt-get install -p squashfs-tools
        mksquashfs prime cmdhelp_1.1.0_amd64.snap -noappend -comp xz

    # 4. Publish directly to the stable storefront channel
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      with:
        snap: cmdhelp_1.1.0_amd64.snap
        release: stable

