name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get clean
        sudo apt-get update --fix-missing
        sudo apt-get install -y --fix-missing python3-tk squashfs-tools

    - name: Prepare Package Blueprint Layout
      run: |
        mkdir -p prime/meta
        mkdir -p prime/bin
        cp cmdhelp.py prime/bin/cmdhelp.py
        chmod +x prime/bin/cmdhelp.py

    - name: Compile Runtime Metadata Sheet
      run: |
        cat << 'EOF' > prime/meta/snap.yaml
        name: cmdhelp
        version: '1.2.0'              # Bumped to 1.2.0 to force a clean store revision slot
        summary: Desktop helper tool with Tkinter GUI
        description: |
          A helpful desktop utility tool built with Python and Tkinter.
        confinement: strict
        grade: stable
        base: core24
        architectures:
          - amd64
        apps:
          cmdhelp:
            command: bin/python3 $SNAP/bin/cmdhelp.py
            plugs:
              - desktop
              - desktop-legacy
              - x11
              - wayland
        EOF

    - name: Pack Production Snap
      shell: python
      run: |
        import lzma
        import os
        os.system("tar -cf prime.tar -C prime .")
        with open("prime.tar", "rb") as f_in:
            with lzma.open("cmdhelp_1.2.0_amd64.snap", "wb") as f_out:
                f_out.write(f_in.read())

    # Direct cloud store upload bypassing the broken action-publish plugin
    - name: Push Package to Store Database
      env:
        STORE_AUTH: ${{ secrets.SNAPCRAFT_TOKEN }}
      run: |
        curl -X POST -H "Authorization: Bearer $STORE_AUTH" \
          -F "snap=@cmdhelp_1.2.0_amd64.snap" \
          -F "channels=stable" \
          https://snapcraft.io

