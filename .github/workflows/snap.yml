name: Release Stable Snap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # 1. Install Tkinter using GitHub's native environment to prevent sudo blocks
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    # 2. Build the snap using the standard workflow arguments flag
    - uses: snapcore/action-build@v1
      id: snapcraft
      with:
        snapcraft-args: --destructive-mode

    # 3. Publish directly to the stable channel
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      with:
        snap: ${{ steps.snapcraft.outputs.snap }}
        release: stable
