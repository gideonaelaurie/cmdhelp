name: cmdhelp
version: '1.1.5'              # Advanced key index to trigger a clean tracking pull
summary: Command finder tool with Tkinter GUI
description: |
  A command finder tool built with Python and Tkinter.

grade: stable
confinement: strict
base: core24

apps:
  cmdhelp:
    command: bin/python3 $SNAP/cmdhelp.py
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland

parts:
  cmdhelp-code:
    plugin: nil               # Bypasses complex container folder mappings
    source: .
    stage-packages:
      - python3-tk
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/
      cp cmdhelp.py $CRAFT_PART_INSTALL/cmdhelp.py
      chmod 755 $CRAFT_PART_INSTALL/cmdhelp.py
